<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="100%" height="100%" fill="none">
  <defs>
    <!-- Soft Minimal Background Gradient -->
    <linearGradient id="tabBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
  </defs>

  <!-- Rounded App / Tab Tile Base -->
  <rect x="2" y="2" width="28" height="28" rx="8" fill="url(#tabBg)" />

  <!-- Simple Centered Pencil -->
  <g transform="translate(16, 16)">
    <!-- Pencil Body -->
    <rect x="-3" y="-7" width="6" height="12" rx="1" fill="#FCD34D" />
    <!-- Pencil Tip -->
    <polygon points="-3,-7 3,-7 0,-13" fill="#F97316" />
    <!-- Pencil Lead -->
    <polygon points="-1,-9 1,-9 0,-13" fill="#374151" />
    <!-- Pencil Eraser -->
    <rect x="-2.5" y="5" width="5" height="2.5" rx="0.5" fill="#F472B6" />
  </g>
</svg>